<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>granddia chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #11111a;
      --surface2: #18182a;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5b0;
      --accent2: #7b5ea7;
      --text: #f0ede8;
      --muted: #6b6b7e;
      --bubble-in: #1c1c2e;
      --bubble-own: #1a3a2e;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* animated grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,176,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,176,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* glowing orb */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(123,94,167,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── MESSAGES ── */
    #messages {
      overflow-y: auto;
      padding: 28px 28px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: rise 0.25s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 0 4px;
    }

    .msg-author {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .bubble {
      background: var(--bubble-in);
      border: 1px solid var(--border);
      border-radius: 2px 16px 16px 16px;
      padding: 11px 16px;
      font-size: 0.93rem;
      line-height: 1.55;
      max-width: 76%;
      color: var(--text);
      word-break: break-word;
    }

    .day-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
    }

    .day-divider::before,
    .day-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .day-divider span {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 10px;
      color: var(--muted);
      padding: 60px 0;
    }

    .empty-icon {
      font-size: 2.5rem;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 0.88rem;
    }

    /* ── INPUT BAR ── */
    #input-bar {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .name-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 6px;
      outline: none;
      width: 140px;
      transition: border-color 0.2s;
    }

    #name-input:focus { border-bottom-color: var(--accent); }

    .compose-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 6px 6px 18px;
      transition: border-color 0.2s;
    }

    .compose-row:focus-within {
      border-color: rgba(0,229,176,0.35);
    }

    #msg-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.93rem;
      outline: none;
      padding: 7px 0;
    }

    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover { transform: scale(1.07); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

    #send-btn svg {
      width: 18px; height: 18px;
      fill: #0a0a0f;
    }

    .char-count {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
      margin-top: 6px;
      padding-right: 4px;
    }

    .char-count.warn { color: #ef9f27; }
  </style>
</head>
<body>
<div class="layout">
  <header>
    <div class="logo">grand<span>dia</span> chat</div>
    <div class="status-pill">
      <span class="dot"></span>
      <span id="online-count">connecting…</span>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">💬</div>
      <p>No messages yet. Say something!</p>
    </div>
  </div>

  <div id="input-bar">
    <div class="name-row">
      <span class="name-label">chatting as</span>
      <input id="name-input" type="text" placeholder="your name" maxlength="24" autocomplete="off"/>
    </div>
    <div class="compose-row">
      <input id="msg-input" type="text" placeholder="type a message…" maxlength="500" autocomplete="off"/>
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="char-count" id="char-count">0 / 500</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
  import {
    getDatabase, ref, push, onChildAdded, query, limitToLast, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA_qbIeZ5rwP-8J5cMUYVlmtGdpwU7fr7Y",
    authDomain: "chat-f9251.firebaseapp.com",
    databaseURL: "https://chat-f9251-default-rtdb.firebaseio.com",
    projectId: "chat-f9251",
    storageBucket: "chat-f9251.firebasestorage.app",
    messagingSenderId: "143049478376",
    appId: "1:143049478376:web:10dd8fe116c3b9e473b95d",
    measurementId: "G-57D0W1FZ87"
  };

  const app = initializeApp(firebaseConfig);
  getAnalytics(app);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  const msgEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty-state');
  const nameInput = document.getElementById('name-input');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const charCount = document.getElementById('char-count');
  const onlineEl = document.getElementById('online-count');

  // Restore saved name
  const savedName = localStorage.getItem('chat_name');
  if (savedName) nameInput.value = savedName;

  // Status label
  onlineEl.textContent = 'live';

  let lastDate = null;
  let msgCount = 0;

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const today = new Date();
    if (d.toDateString() === today.toDateString()) return 'today';
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'yesterday';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function hueFromName(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    const hues = [160, 180, 200, 260, 290, 320, 340];
    return hues[h % hues.length];
  }

  function displayMessage({ name, text, timestamp }) {
    if (emptyEl) emptyEl.remove();
    msgCount++;

    const ts = timestamp || Date.now();
    const dateStr = formatDate(ts);

    if (dateStr !== lastDate) {
      lastDate = dateStr;
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.innerHTML = `<span>${dateStr}</span>`;
      msgEl.appendChild(div);
    }

    const hue = hueFromName(name || 'anon');
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.innerHTML = `
      <div class="msg-meta">
        <span class="msg-author" style="color: hsl(${hue},70%,65%)">${escapeHtml(name || 'anonymous')}</span>
        <span class="msg-time">${formatTime(ts)}</span>
      </div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    msgEl.appendChild(row);
    msgEl.scrollTop = msgEl.scrollHeight;
  }

  // Load last 60 messages
  const recent = query(messagesRef, limitToLast(60));
  onChildAdded(recent, snap => displayMessage(snap.val()));

// ── BLOCKED WORDS — add yours to this list ──
const BLOCKED_WORDS = [
  'fuck',
  'bitch',
  'bastard',
  'damn',
  'crap',
  'dick',
  'cock',
  'pussy',
  'cunt',
  'whore',
  'slut',
  'fag',
  'nigga',
  'nigger',
  'kike',
  'spic',
  'chink',
  'wetback',
  'cracker',
  'dyke',
  'tranny',
  'rape',
  'molest',
  'pedo',
  'kill yourself',
];

function sendMessage() {
    const name = nameInput.value.trim() || 'anonymous';
    const text = msgInput.value.trim();
    if (!text) return;

    // Filter check
    const lower = text.toLowerCase();
    const isBlocked = BLOCKED_WORDS.some(w => lower.includes(w.toLowerCase()));
    if (isBlocked) return; // silently block — or replace `return` with an alert if you want a warning
    localStorage.setItem('chat_name', name);
    push(messagesRef, { name, text, timestamp: Date.now() });
    msgInput.value = '';
    charCount.textContent = '0 / 500';
    charCount.classList.remove('warn');
    msgInput.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  msgInput.addEventListener('input', () => {
    const len = msgInput.value.length;
    charCount.textContent = `${len} / 500`;
    charCount.classList.toggle('warn', len > 400);
  });
</script>
</body>
</html>
